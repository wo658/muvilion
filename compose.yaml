services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      APP_ORIGIN: http://web.redpact.test:3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s
