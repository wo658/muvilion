services:
  engine:
    build:
      context: .
      dockerfile: engine/Dockerfile
    healthcheck:
      test: ["CMD", "uv", "run", "--no-sync", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      ENGINE_URL: http://engine:8000
    depends_on:
      engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s
