[project]
name = "engine"
version = "0.1.0"
description = "Deterministic layout, validation and crowd-simulation engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "jupedsim>=1.4,<1.5",
    "numpy>=2.5.4",
    "ortools>=9.15.6755",
    "pydantic>=2",
    "shapely>=2",
    "simpy>=4.1.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient"]
