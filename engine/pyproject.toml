[project]
name = "engine"
version = "0.1.0"
description = "Drawing extraction, layout optimization and geometry validation"
requires-python = ">=3.12"
dependencies = [
    "ezdxf>=1.4.5",
    "fastapi>=0.162.0",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "ortools>=9.15.6755",
    "pdfplumber>=0.11.10",
    "pillow>=13.0.0",
    "pydantic>=2",
    "pypdfium2>=5.14.0",
    "python-multipart>=0.0.32",
    "shapely>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx`", "ignore:Bitwise inversion"]
